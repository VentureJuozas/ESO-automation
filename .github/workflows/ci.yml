name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python tests
        env:
          ESO_STEP_DELAY: "0"
          ESO_DB: /tmp/eso-ci.sqlite
          PYTHONPATH: src:.
        run: |
          python -m pip install -r requirements.txt
          python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Frontend build
        run: |
          cd web
          npm ci --prefer-offline || npm install
          npm run build
          npm run lint
